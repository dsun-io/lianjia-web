<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f3f4f6"/>
  <!-- Fence installation scene -->
  <g stroke="#9ca3af" stroke-width="3" fill="none">
    <!-- Posts -->
    <line x1="120" y1="100" x2="120" y2="320" stroke-width="5"/>
    <line x1="300" y1="100" x2="300" y2="320" stroke-width="5"/>
    <line x1="480" y1="100" x2="480" y2="320" stroke-width="5"/>
    <!-- Wire lines -->
    <line x1="120" y1="160" x2="480" y2="160"/>
    <line x1="120" y1="200" x2="480" y2="200"/>
    <line x1="120" y1="240" x2="480" y2="240"/>
    <line x1="120" y1="280" x2="480" y2="280"/>
    <!-- Barbs on top wire -->
    <g stroke="#6b7280" stroke-width="2">
      <line x1="200" y1="160" x2="210" y2="148"/><line x1="200" y1="160" x2="210" y2="172"/>
      <line x1="380" y1="160" x2="390" y2="148"/><line x1="380" y1="160" x2="390" y2="172"/>
    </g>
  </g>
  <!-- Ground line -->
  <line x1="60" y1="320" x2="540" y2="320" stroke="#d1d5db" stroke-width="2"/>
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#9ca3af" font-weight="bold">Farm Installation — Replace with Real Photo</text>
</svg>