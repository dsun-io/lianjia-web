<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ee9b00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ee9b00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Factory building - main -->
  <rect x="100" y="180" width="1000" height="350" fill="url(#wall)"/>
  
  <!-- Roof -->
  <polygon points="80,180 600,60 1120,180" fill="url(#roof)"/>
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#6b7280" stroke-width="3"/>
  
  <!-- Roof ridge detail -->
  <line x1="600" y1="60" x2="600" y2="55" stroke="#9ca3af" stroke-width="2"/>
  
  <!-- Smokestacks -->
  <rect x="850" y="40" width="25" height="140" fill="#4b5563"/>
  <rect x="900" y="60" width="20" height="120" fill="#4b5563"/>
  <!-- Smoke -->
  <g opacity="0.3" fill="#9ca3af">
    <circle cx="862" cy="30" r="15"/>
    <circle cx="870" cy="15" r="12"/>
    <circle cx="858" cy="5" r="10"/>
    <circle cx="910" cy="50" r="12"/>
    <circle cx="918" cy="35" r="10"/>
    <circle cx="912" cy="22" r="8"/>
  </g>

  <!-- Large windows / bays -->
  <g fill="#1a1a2e" stroke="#4b5563" stroke-width="2">
    <rect x="140" y="220" width="120" height="160" rx="4"/>
    <rect x="300" y="220" width="120" height="160" rx="4"/>
    <rect x="460" y="220" width="120" height="160" rx="4"/>
    <rect x="620" y="220" width="120" height="160" rx="4"/>
    <rect x="780" y="220" width="120" height="160" rx="4"/>
  </g>
  
  <!-- Window glow (warm light inside) -->
  <g fill="#ee9b00" opacity="0.08">
    <rect x="142" y="222" width="116" height="156" rx="3"/>
    <rect x="302" y="222" width="116" height="156" rx="3"/>
    <rect x="462" y="222" width="116" height="156" rx="3"/>
    <rect x="622" y="222" width="116" height="156" rx="3"/>
    <rect x="782" y="222" width="116" height="156" rx="3"/>
  </g>

  <!-- Factory door -->
  <rect x="960" y="300" width="100" height="230" fill="#111827" stroke="#4b5563" stroke-width="2"/>
  <rect x="965" y="305" width="42" height="220" fill="#1a1a2e"/>
  <rect x="1013" y="305" width="42" height="220" fill="#1a1a2e"/>
  <circle cx="1003" cy="420" r="3" fill="#6b7280"/>
  <circle cx="1018" cy="420" r="3" fill="#6b7280"/>

  <!-- Ground -->
  <rect x="0" y="530" width="1200" height="100" fill="#111827"/>
  
  <!-- Wire mesh rolls in foreground -->
  <g fill="none" stroke="#6b7280" stroke-width="1.5" opacity="0.6">
    <!-- Roll 1 -->
    <ellipse cx="200" cy="500" rx="50" ry="30"/>
    <ellipse cx="200" cy="500" rx="35" ry="20"/>
    <ellipse cx="200" cy="500" rx="20" ry="10"/>
    <!-- Roll 2 -->
    <ellipse cx="350" cy="510" rx="45" ry="28"/>
    <ellipse cx="350" cy="510" rx="30" ry="18"/>
    <ellipse cx="350" cy="510" rx="15" ry="8"/>
    <!-- Roll 3 -->
    <ellipse cx="480" cy="505" rx="48" ry="26"/>
    <ellipse cx="480" cy="505" rx="32" ry="16"/>
  </g>

  <!-- Wire spool / coil -->
  <g fill="none" stroke="#9ca3af" stroke-width="1" opacity="0.5">
    <circle cx="700" cy="490" r="35"/>
    <circle cx="700" cy="490" r="25"/>
    <circle cx="700" cy="490" r="15"/>
    <line x1="665" y1="490" x2="735" y2="490" stroke-width="0.5"/>
    <line x1="700" y1="455" x2="700" y2="525" stroke-width="0.5"/>
  </g>

  <!-- Fence posts leaning against wall -->
  <g stroke="#4b5563" stroke-width="3" opacity="0.5">
    <line x1="130" y1="380" x2="145" y2="530"/>
    <line x1="150" y1="375" x2="165" y2="530"/>
    <line x1="170" y1="380" x2="185" y2="530"/>
  </g>

  <!-- Conveyor belt suggestion -->
  <g stroke="#374151" stroke-width="2" fill="none" opacity="0.4">
    <line x1="550" y1="420" x2="950" y2="420"/>
    <line x1="550" y1="430" x2="950" y2="430"/>
    <rect x="560" y="415" width="8" height="20" fill="#374151"/>
    <rect x="620" y="415" width="8" height="20" fill="#374151"/>
    <rect x="680" y="415" width="8" height="20" fill="#374151"/>
    <rect x="740" y="415" width="8" height="20" fill="#374151"/>
    <rect x="800" y="415" width="8" height="20" fill="#374151"/>
    <rect x="860" y="415" width="8" height="20" fill="#374151"/>
    <rect x="920" y="415" width="8" height="20" fill="#374151"/>
  </g>

  <!-- Warm interior light spilling out -->
  <g fill="#ee9b00" opacity="0.05">
    <rect x="960" y="530" width="100" height="40"/>
    <polygon points="960,530 1060,530 1100,570 920,570" opacity="0.3"/>
  </g>

  <!-- "ANPING" subtle text on building -->
  <text x="600" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6b7280" letter-spacing="12" opacity="0.4">ANPING WIRE MESH</text>

  <!-- Foreground vignette -->
  <rect x="0" y="560" width="1200" height="70" fill="#111827" opacity="0.8"/>
  
  <!-- Atmospheric particles -->
  <g fill="#ee9b00" opacity="0.06">
    <circle cx="300" cy="200" r="2"/>
    <circle cx="600" cy="150" r="1.5"/>
    <circle cx="900" cy="250" r="2"/>
    <circle cx="450" cy="300" r="1"/>
    <circle cx="750" cy="180" r="1.5"/>
  </g>
</svg>
